<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
/* VOICE: 무표정한 영수증 말투로 적힌 괴담. 결말에서만 살짝 웃긴다
   IDEA: 노란 방 형광등 아래에서 출력되는 탐사 영수증. 체크할수록 아래로 계속 인쇄된다
   PICTURE: 벽지 위 한 장의 영수증, 위에서 빛나는 형광등 한 줄
   COLOUR and TYPE: 바랜 벽지 노랑, 미색 종이, 먹색, 캐릭터가 고른 색. Noto Sans KR, 좁은 자간
   LAYOUT: 가운데 560px 종이 한 장, 하단 고정 버튼. 결과는 같은 모양의 정산서가 연출과 함께 뜬다 */
:root{color-scheme:light;--wall:#d6c98c;--paper:#fcfaf1;--ink:#1c1c1a;--soft:#857f63;--line:#ddd6b6;--tint:#f4eed6;--red:#a5402f;--ok:#2f6b4f;--amber:#9a6b15}
:root[data-theme=dark],:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html{background:var(--wall)}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.6 "Noto Sans KR",system-ui,sans-serif;letter-spacing:-.02em;overflow-x:clip;background-color:var(--wall);background-image:repeating-linear-gradient(90deg,rgba(120,100,30,.07) 0 2px,transparent 2px 22px,rgba(120,100,30,.05) 22px 23px,transparent 23px 44px)}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
.stage{display:flex;flex-direction:column;align-items:center;padding:0 12px 120px}
.wrap{width:min(100%,600px);display:flex;flex-direction:column;align-items:center;padding:0 20px 28px;background:var(--wall)}
.tube{width:min(340px,70%);height:10px;background:#fffbe3;border-radius:0 0 3px 3px;box-shadow:0 0 36px 14px rgba(255,248,205,.7);animation:flick 9s infinite}
@keyframes flick{0%,93%,100%{opacity:1}94%{opacity:.4}95%{opacity:1}97%{opacity:.6}98%{opacity:1}}
.paper{position:relative;width:100%;margin-top:24px;background:var(--paper);padding:40px clamp(20px,6vw,42px) 30px;box-shadow:0 1px 0 #c4b77c,0 30px 50px -30px rgba(70,55,10,.45)}
.head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.mini{width:52px;height:5px;border-radius:3px;background:#e9d24a;box-shadow:0 0 14px 3px rgba(233,210,74,.45);margin-bottom:14px}
h1,h2{margin:0;font-size:25px;line-height:1.3;font-weight:700;letter-spacing:-.045em}
.meta{font-size:12.5px;color:var(--soft)}
.cut{border-top:1.5px dashed var(--line);margin:22px 0 16px}
.solid{border-top:1.5px solid var(--ink);margin:18px 0 10px}
.row2{display:flex;justify-content:space-between;gap:14px;font-size:13px;color:var(--soft)}
.row2>:last-child{text-align:right}
.row2 span{word-break:keep-all}
.row2 .nw{flex:none;white-space:nowrap}
.kv>:first-child{flex:none}
.row2.b{font-size:14px;font-weight:700;color:var(--ink)}
.crew{display:flex;flex-direction:column;margin-top:6px}
.mem{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid #f0ead2}
.ph{position:relative;flex:none;width:44px;height:44px;border-radius:6px;background:var(--tint) center/cover no-repeat;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.ph svg{opacity:.45}.ph.has svg{display:none}
.ph input,.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.ph:focus-within,.sw:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.sw{position:relative;flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--paper),0 0 0 4px #d8d0ae;cursor:pointer}
.nm{flex:1;border:0;border-bottom:1px dashed transparent;background:transparent;font-weight:700;font-size:15.5px;padding:6px 0;min-height:40px;transition:color .3s}
.nm:hover{border-bottom-color:var(--line)}.nm:focus{outline:none;border-bottom-color:var(--ink)}
.nm.haunt{color:var(--red)}
.nmt{display:none;flex:1;font-weight:700}
.x{flex:none;width:32px;height:32px;border:0;background:none;color:var(--soft);cursor:pointer;font-size:18px;border-radius:6px}
.x:hover{color:var(--ink);background:var(--tint)}
.add{margin-top:10px;align-self:flex-start;min-height:36px;padding:0 12px;border:1px dashed #b9b195;background:none;color:var(--soft);font-size:13px;cursor:pointer;border-radius:6px}
.add:hover{color:var(--ink);border-color:var(--ink)}
.tip{font-size:12px;color:var(--soft);margin-top:8px}
section{transition:transform .6s,filter .6s}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h b{font-size:17px;letter-spacing:-.04em}
.code{font-size:12px;color:var(--soft);white-space:nowrap}
.code.side{color:var(--amber);font-weight:500}
.narr{font-size:12.5px;line-height:1.65;color:#a39d82;margin:4px 0 6px;word-break:keep-all;min-height:1em}
.who{display:inline-flex;gap:4px;vertical-align:middle}
.who i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.it{display:flex;align-items:center;gap:8px;min-height:36px;padding:1px 0}
.it .tx{font-size:13.5px;line-height:1.4;word-break:keep-all}
.it .lead{flex:1 1 14px;align-self:center;border-bottom:1.5px dotted var(--line);transform:translateY(5px);min-width:14px}
.ck{flex:none;width:30px;height:34px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.ck::before{content:"";width:16px;height:16px;border-radius:4px;border:1.5px solid #cbc3a2;transition:background .12s,border-color .12s}
.ck[aria-pressed=true]::before{background:var(--c);border-color:var(--c)}
.ck:focus-visible{outline:2px solid var(--ink);outline-offset:-6px;border-radius:6px}
.need{font-size:12px;color:var(--soft);text-align:right;margin-top:6px}
.ev{margin:18px 0 0;padding:14px 16px;background:var(--tint);border-radius:6px}
.ev+.ev{margin-top:8px}
.ev-h{display:flex;align-items:center;gap:8px;font-size:13px}
.ev-h b{letter-spacing:-.03em}
.ev-h span{display:inline-flex;align-items:center;gap:5px;color:var(--soft);font-size:12px}
.ev-h span i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.ev p{margin:4px 0 0;font-size:13px;line-height:1.65;color:#5d5946;word-break:keep-all}
.ev .lines i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:2px}
.ev .lines{margin:6px 0 0;font-size:13px;display:flex;flex-direction:column;gap:2px}
.new{animation:print .5s ease-out both}
@keyframes print{from{opacity:0;transform:translateY(-8px)}}
.hint{font-size:12.5px;color:var(--soft);text-align:center;margin:10px 0 0}
.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 32px),420px);display:flex;gap:6px;padding:6px;background:rgba(252,250,241,.94);border-radius:14px;box-shadow:0 0 0 1px rgba(60,50,10,.08),0 12px 30px -12px rgba(60,50,10,.45);z-index:5;backdrop-filter:blur(6px)}
.dock button,.ov-bar button{min-height:46px;padding:0 16px;border-radius:10px;border:0;background:transparent;cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.dock button:not(.go):hover,.ov-bar button:not(.go):hover{background:var(--tint)}
.dock .go,.ov-bar .go{background:var(--ink);color:var(--paper);font-weight:700;flex:1}
.go small{font-weight:400;font-size:12px;opacity:.6}
.ov-bar{background:rgba(252,250,241,.94);padding:6px;border-radius:14px;box-shadow:0 0 0 1px rgba(60,50,10,.08),0 12px 30px -12px rgba(60,50,10,.45)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* 공포 연출 */
.fx-mirror .it .tx{display:inline-block;transform:scaleX(-1)}
.fx-blur{filter:blur(1.6px)}
.fx-blur .it{animation:wob 1.3s ease-in-out infinite}
@keyframes wob{50%{transform:translateX(2px)}}
.whis{position:absolute;pointer-events:none;font-size:13px;color:#8d8668;letter-spacing:.08em;white-space:nowrap;animation:whis 3.6s ease-in-out forwards;z-index:2}
@keyframes whis{0%{opacity:0;filter:blur(3px)}25%{opacity:.75;filter:none}70%{opacity:.5}100%{opacity:0;filter:blur(2px);transform:translateX(8px)}}
.veil{position:fixed;inset:0;pointer-events:none;z-index:8}
.veil.flick{background:#14120b;animation:dim 2.4s forwards}
@keyframes dim{0%{opacity:0}8%{opacity:.55}12%{opacity:.1}20%{opacity:.7}26%{opacity:.25}40%{opacity:.8}70%{opacity:.6}100%{opacity:0}}
.veil.torch{animation:torch 3.2s forwards}
@keyframes torch{0%{opacity:0}15%,75%{opacity:1}100%{opacity:0}}
/* 결과 */
.ov{position:fixed;inset:0;z-index:10;overflow:auto;background-color:var(--wall);display:flex;flex-direction:column;align-items:center;padding:0 12px 40px}
.ov-bar{width:min(calc(100% - 40px),420px);display:flex;gap:6px}
.rrow{position:relative}
.pre .rrow,.pre .stamp{opacity:0}
.play .rrow{animation:print .55s var(--d) ease-out both}
.res-who{display:flex;justify-content:space-between;align-items:center;gap:10px}
.res-who>span{display:flex;align-items:center;gap:10px;font-weight:700}
.res-who img,.res-who .noimg{width:38px;height:38px;border-radius:6px;object-fit:cover;background:var(--tint);flex:none}
.res-who em{font-style:normal;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:99px;border:1.5px solid currentColor}
.res-t{position:relative;font-size:19px;font-weight:700;letter-spacing:-.045em;margin-top:12px}
.res-t .c{display:inline-block;white-space:pre}
.res-p{margin:4px 0 0;font-size:13.5px;line-height:1.7;color:#5d5a4a;word-break:keep-all}
.stamp{position:absolute;right:24px;top:86px;transform:rotate(-12deg);border:2px solid currentColor;padding:4px 10px;font-weight:700;font-size:14px;border-radius:4px;opacity:.88;background:rgba(252,250,241,.6);white-space:nowrap}
.play .stamp{animation:slam .5s var(--d) both}
@keyframes slam{0%{opacity:0;transform:rotate(-12deg) scale(1.6)}70%{opacity:.9;transform:rotate(-12deg) scale(.96)}100%{opacity:.88;transform:rotate(-12deg) scale(1)}}
.play .res-t .c{animation:var(--a,rise) var(--t,.5s) calc(var(--d) + .25s + var(--i) * 50ms) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes glow{0%{opacity:0;color:#3fbf7a;text-shadow:0 0 12px #8ff0b8}50%{opacity:1;color:#2f9a63;text-shadow:0 0 10px #8ff0b8}100%{color:inherit;text-shadow:none}}
@keyframes wave{0%{opacity:0;transform:translateY(10px);color:#3f8fb0}40%{opacity:1;transform:translateY(-5px)}70%{transform:translateY(2px)}100%{transform:none;color:inherit}}
@keyframes drift{from{opacity:0;transform:translateX(-16px)}}
@keyframes flip{from{opacity:0;transform:rotateX(90deg)}}
@keyframes type{0%{opacity:0}100%{opacity:1}}
@keyframes gather{from{opacity:0;transform:translateX(calc(var(--o) * 7px))}}
@keyframes squeeze{0%{opacity:0;transform:translateX(calc(var(--o) * 7px))}60%{opacity:1;transform:none}100%{transform:translateX(calc(var(--o) * -2px))}}
@keyframes wall{0%{opacity:0}35%{opacity:1;color:var(--ink)}100%{color:#b3a256}}
@keyframes sink{0%{opacity:0;filter:blur(6px);transform:translateY(6px)}60%{opacity:.7;filter:blur(2px)}100%{opacity:1;filter:none}}
@keyframes blind{from{opacity:0;filter:blur(5px)}}
@keyframes smear{from{opacity:0;transform:scaleX(2.4);filter:blur(3px);color:#c9b866}}
@keyframes walk{0%{opacity:0}35%{opacity:1;transform:none}65%{opacity:.4;transform:translateX(12px)}100%{opacity:1;transform:none}}
@keyframes knock{0%,30%,60%,100%{transform:none}8%,38%,68%{transform:translateX(-3px)}16%,46%,76%{transform:translateX(3px)}}
.e-knock.play-t .res-t{animation:knock 1.6s calc(var(--d) + 1s) both}
.res-t[data-ghost]::after{content:attr(data-ghost);position:absolute;left:0;top:0;color:var(--red);opacity:0;pointer-events:none}
.play .res-t[data-ghost]::after{animation:ghost 3.2s calc(var(--d) + .8s) both}
@keyframes ghost{0%{opacity:0;transform:none}20%{opacity:.4;transform:translate(3px,1px)}60%{opacity:.25;transform:translate(1px,0)}100%{opacity:0;transform:none}}
.intro{position:fixed;inset:0;z-index:12;display:grid;place-items:center;overflow:hidden;cursor:pointer;background:var(--wall)}
.intro p{position:relative;z-index:2;margin:0;font-size:22px;font-weight:700;letter-spacing:-.04em;opacity:0;animation:say 2.6s .5s forwards}
@keyframes say{0%{opacity:0;transform:translateY(6px)}25%,80%{opacity:1;transform:none}100%{opacity:0}}
.intro .lt{position:absolute;left:50%;top:55%;width:40px;height:40px;margin:-20px;border-radius:50%;background:#fff;box-shadow:0 0 80px 60px #fffdf0;animation:open 2.8s ease-in forwards}
@keyframes open{0%{transform:scale(0);opacity:0}20%{opacity:1}100%{transform:scale(40);opacity:1}}
.intro .tb{position:absolute;top:0;left:50%;width:300px;margin-left:-150px;height:10px;background:#fffbe3;box-shadow:0 0 36px 14px rgba(255,248,205,.7);animation:die 1.6s forwards}
@keyframes die{0%,20%{opacity:1}24%{opacity:.2}30%{opacity:.9}40%{opacity:.1}48%{opacity:.6}60%,100%{opacity:0}}
.intro.s-no{animation:night 2.8s forwards}.intro.s-no p{color:#e7dfbd}
@keyframes night{0%,40%{background:var(--wall)}70%,100%{background:#12110d}}
.intro.s-mix .dk{position:absolute;z-index:1;inset:0 0 0 50%;background:#12110d;animation:half 2.6s forwards}
@keyframes half{0%,30%{opacity:0}60%,100%{opacity:1}}
.intro.s-mix p{background:rgba(252,250,241,.92);padding:8px 16px;border-radius:6px}
.intro.out{transition:opacity .5s;opacity:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:6px;font-size:13px;z-index:20}
.modal{position:fixed;inset:0;background:rgba(20,18,10,.82);display:grid;place-items:center;padding:20px;z-index:30}
.modal>div{max-width:520px;max-height:100%;overflow:auto;background:var(--paper);padding:16px;border-radius:8px;text-align:center}
.modal img{width:100%;display:block;margin:10px 0}
.modal button{min-height:44px;padding:0 20px;border:0;border-radius:6px;background:var(--ink);color:var(--paper);cursor:pointer}
.cap *,.cap *::after{animation:none!important;transition:none!important}
.cap .ph:not(.has),.cap .nm,.cap .x,.cap .add,.cap .ph input,.cap .sw input,.cap .hint,.cap .tip,.cap .whis{display:none}.cap .nmt{display:block}.cap .pre .rrow,.cap .pre .stamp{opacity:1}
@media(prefers-reduced-motion:reduce){.tube,.new,.play .rrow,.play .stamp,.play .res-t .c{animation:none!important}.pre .rrow,.pre .stamp{opacity:1}}
@media(max-width:480px){.it .tx{font-size:13px}.stamp{top:12px;right:12px;font-size:12px;padding:3px 8px}}
</style>
</head>
<body>
<div class="stage">
 <div class="wrap" id="sheet">
  <div class="tube" aria-hidden="true"></div>
  <div class="paper" id="paper">
   <div class="head"><div class="mini" aria-hidden="true"></div><h1>백룸 탐사 일지</h1><div class="meta" id="meta"></div></div>
   <div class="cut"></div>
   <div class="row2"><span>탐사대</span><span id="crewCount"></span></div>
   <div class="crew" id="crew"></div>
   <div class="tip">사진 칸을 누르면 이미지를, 동그라미를 누르면 색을 고를 수 있어요.</div>
   <div id="body"></div>
  </div>
 </div>
</div>
<div class="dock" data-html2canvas-ignore><button id="saveMain"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>이미지 저장</button><button class="go" id="openRes">결과 보기</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
{
const LV={
 WAKE:{code:'Level 0 · 입구',name:'눈을 뜨다',narr:'눈을 떴다. 머리 위에서 형광등이 일정한 음으로 윙윙거린다. 카펫은 축축하고, 공기에서는 오래 닫혀 있던 서랍 냄새가 난다. 방금 전까지 어디에 있었는지 아무리 떠올려도 기억나지 않는다.',items:[
  ['형광등 소리에 먼저 눈을 뜬 사람',{obs:1}],
  ['일어나자마자 주머니부터 뒤진 사람',{sup:1}],
  ['일행 이름부터 크게 부른 사람',{risk:1}],
  ['벽지를 손으로 만져 본 사람',{obs:1}],
  ['꿈이라고 생각하고 다시 누운 사람',{san:5}],
  ['휴대폰 시계가 계속 바뀌는 걸 본 사람',{san:-5,fx:'erase'}],
  ['젖은 카펫 냄새를 맡아 본 사람',{obs:1}],
  ['누가 여기 데려왔는지부터 따진 사람',{san:-5,risk:1}],
  ['아무렇지 않게 스트레칭부터 한 사람',{san:10}]]},
 WALK:{code:'Level 0',name:'노란 방을 걷다',narr:'어느 방향으로 걸어도 노란 벽지와 낮은 천장이 이어진다. 방은 조금씩 다르게 생겼지만 묘하게 같은 방이라는 느낌이 든다. 멀리서 형광등 하나가 꺼졌다가, 아무 일 없었다는 듯 다시 켜진다.',items:[
  ['벽에 화살표를 그리며 걷는 사람',{obs:1}],
  ['같은 방을 세 번 지나쳤다고 확신한 사람',{obs:1,san:-10,fx:'dup'}],
  ['멀리서 들린 “여기야”에 대답한 사람',{risk:2,f:'answered',fx:'whisper',w:'여기야'}],
  ['형광등 소리가 오히려 편안한 사람',{san:10}],
  ['쉬자고 먼저 말한 사람',{san:5,risk:1}],
  ['바닥에 떨어진 남의 신발을 주운 사람',{sup:1,san:-5}],

const ALL={...LV,...SIDES};

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okP=p=>/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(p||'');
const okC=c=>/^#[0-9a-fA-F]{6}$/.test(c||'')?c:COLORS[0];
const nameOf=(c,i)=>c.name.trim()||`탐험자 ${i+1}`;
const ck=(cid,lv)=>(st.checks[cid]&&st.checks[cid][lv])||[];

const CAM='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1c1a" stroke-width="1.6" aria-hidden="true"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';

function flagsOf(cid,lvs){const f={};lvs.forEach(lv=>ck(cid,lv).forEach(i=>{const e=ALL[lv].items[i][1];if(e.f)f[e.f]=1}));return f}
function sidesOf(cid,path){const f=flagsOf(cid,path);return Object.keys(SIDES).filter(k=>SIDES[k].trig.some(t=>f[t]))}
function stats(cid,path,noSide){const s={san:70,sup:0,obs:0,risk:0,f:{},n:0},zones=noSide?[...path]:[...path,...sidesOf(cid,path)];
 zones.forEach(lv=>ck(cid,lv).forEach(i=>{const e=ALL[lv].items[i][1];s.n++;for(const k of['san','sup','obs','risk'])if(e[k])s[k]+=e[k];if(e.f)s.f[e.f]=1}));
 s.san=Math.max(0,Math.min(100,s.san));for(const k of['sup','obs','risk'])s[k]=Math.max(0,s[k]);return s}
function nextLv(g,s){
 if(g===2)return s.risk>=3?'HALL':s.obs>=4?'PIPE':s.sup>=3?'MALL':'GARAGE';
 if(g===3)return(s.risk>=5||s.f.smile)?'DARK':(s.san>=65&&s.sup>=2)?'POOL':s.obs>=6?'HOTEL':'OFFICE';
 return STAGES[g+1][0]}
function trace(cid){const path=['WAKE'];for(let g=0;g<STAGES.length;g++){const n=ck(cid,path[g]).length;if(n<ADV)return{path,need:ADV-n};if(g<STAGES.length-1)path.push(nextLv(g,stats(cid,path,true)))}return{path,done:true}}
function ending(cid,path){const s=stats(cid,path),f=s.f;let k;
 if(s.san<=20)k='wall';else if(f.hand||(f.smile&&f.answered))k='hand';else if(f.stranger&&!f.tested)k='swap';
 else if(f.stay&&!f.stairs)k='stay';else if(f.badge&&(f.phone||f.knock))k='job';else if(f.light&&s.risk>=5)k='loop';
 else if(f.knock&&f.lookback)k='knock';else if(f.blind&&s.san<50)k='blind';
 else if(f.stairs&&s.san>=40)k='stairs';else if(f.operator&&s.san>=40)k='operator';else if((f.exit||f.green)&&s.obs>=5)k='exit';
 else if(f.wind&&f.clue)k='wind';else if(f.together&&s.san>=50)k='together';else if(Math.floor(s.san/10)+s.obs+s.sup*2-s.risk>=11)k='front';
 else if(f.plain&&f.coin)k='lucky';else if(f.paint)k='paint';else k='walk';
 let [cls,title,desc]=END[k];if(cls==='ok'&&f.mirror){cls='hm';desc+=' …그런데 거울 속 내가 반 박자 늦게 웃는다.'}
 return{key:k,cls,label:{ok:'탈출 성공',no:'탈출 실패',hm:'판정 보류'}[cls],title,desc,s}}
function hash(str){let h=2166136261;for(const c of str)h=Math.imul(h^c.codePointAt(0),16777619);return h>>>0}

 $('meta').textContent=`발행 지점 Level 0 · 노란 방 · ${st.chars.length}인`;$('crewCount').textContent=`${st.chars.length} / 4명`}

/* 본문 */
const dots=list=>list.map(({c})=>`<i style="--c:${okC(c.color)}"></i>`).join('');
const names=list=>list.map(({c,i})=>esc(nameOf(c,i))).join(' · ');
function evHTML(title,who,body,lines){return`<div class="ev"><div class="ev-h"><b>${title}</b>${who?`<span>${who}</span>`:''}</div>${lines?`<div class="lines">${lines}</div>`:''}${body?`<p>${body}</p>`:''}</div>`}
function zoneHTML(lv,here,tr){const L=ALL[lv],isSide=!!SIDES[lv],isNew=seen.size&&!seen.has(lv);
 const waiting=here.filter(o=>!isSide&&!tr[o.i].done&&tr[o.i].path[tr[o.i].path.length-1]===lv);
 return`<section class="${isNew?'new':''}" data-lv="${lv}"><div class="cut"></div><div class="sec-h"><b>${L.name}</b><span class="code ${isSide?'side':''}">${L.code}${isSide?' · 선택':''}</span></div>
 <p class="narr">${L.narr}</p>
 ${L.items.map((it,k)=>`<div class="it"><span class="tx">${it[0]}</span><i class="lead"></i>${here.map(({c,i})=>`<button class="ck" style="--c:${okC(c.color)}" data-c="${c.id}" data-lv="${lv}" data-k="${k}" aria-pressed="${ck(c.id,lv).includes(k)}" aria-label="${esc(nameOf(c,i))}: ${esc(it[0])}"></button>`).join('')}</div>`).join('')}
 ${waiting.length?`<div class="need">${waiting.map(o=>`<span class="who"><i style="--c:${okC(o.c.color)}"></i></span> ${esc(nameOf(o.c,o.i))} ${tr[o.i].need}개 더`).join(' &nbsp; ')}</div>`:''}
 ${isSide?'<div class="need">샛길은 체크하지 않아도 계속 진행돼요</div>':''}</section>`}
function groupBy(list,fn){const m=new Map();list.forEach(o=>{const k=fn(o);if(!m.has(k))m.set(k,[]);m.get(k).push(o)});return m}
function stageEvents(g,P,tr){let h='';
 // 선택으로 생긴 사건
 const by={};P.forEach(o=>{const lv=tr[o.i].path[g];if(!lv)return;const f=flagsOf(o.c.id,[lv]);Object.keys(f).forEach(k=>{if(EVF[k])(by[k]=by[k]||[]).push(o)})});
 Object.keys(EVF).forEach(k=>{if(by[k])h+=evHTML(EVF[k][0],dots(by[k])+' '+names(by[k]),EVF[k][1])});
 // 흩어짐 · 동행 · 재회
 if(g===2||g===3){const r=P.filter(o=>tr[o.i].path[g+1]);if(r.length>=2){const gr=groupBy(r,o=>tr[o.i].path[g+1]);
  const prevSplit=g===3&&new Set(r.map(o=>tr[o.i].path[3])).size>1;
  if(gr.size===1){const lv=[...gr.keys()][0];h+=evHTML(prevSplit?'합류':'동행',dots(r)+' '+names(r),prevSplit?`다른 길로 갔지만 ${LV[lv].name}에서 다시 마주쳤다. 반가움보다 의심이 먼저 든다.`:`같은 길을 골랐다. 손전등 하나로 함께 ${LV[lv].name}에 들어선다.`)}
  else h+=evHTML(g===2?'흩어짐':'다시 갈라짐','',g===2?'서로의 발소리가 점점 멀어진다. 부르는 소리가 벽에 먹혀 돌아오지 않는다.':'잠깐 같은 소리를 들은 것 같았는데, 길은 또 나뉘었다.',[...gr].map(([lv,l])=>`<span>${dots(l)} ${names(l)} → ${LV[lv].name}</span>`).join(''))}}
 if(g===4){const r=P.filter(o=>tr[o.i].path[5]);const split=new Set(P.filter(o=>tr[o.i].path[3]).map(o=>tr[o.i].path[3])).size>1||new Set(P.filter(o=>tr[o.i].path[4]).map(o=>tr[o.i].path[4])).size>1;
  if(r.length>=2&&split){const odd=r.some(o=>{const f=stats(o.c.id,tr[o.i].path).f;return f.mirror||f.smile||f.badge||f.hand});h+=evHTML('재회',dots(r)+' '+names(r),'비상계단 층계참에서 다시 만났다. 서로 지나온 층 이야기가 조금씩 어긋난다.'+(odd?' 그중 누군가는 어딘가 달라 보인다.':''))}
  else if(r.length===1&&P.length>1&&split)h+=evHTML('기다림',dots(r)+' '+names(r),'먼저 도착해 층계참에 앉아 기다린다. 아래에서 발소리가 올라올 때마다 숨을 죽인다.');
  else if(r.length>=2)h+=evHTML('계단',dots(r)+' '+names(r),'함께 계단에 도착했다. 발소리가 정확히 사람 수만큼 들린다. 다행이다.')}
 return h}
function renderBody(){const tr=st.chars.map(c=>trace(c.id)),total=STAGES.length,P=st.chars.map((c,i)=>({c,i}));
  let html='';const fresh=new Set();
 STAGES.forEach((group,g)=>{
  group.forEach(lv=>{const here=P.filter(o=>tr[o.i].path[g]===lv);if(!here.length)return;fresh.add(lv);html+=zoneHTML(lv,here,tr)});
  html+=stageEvents(g,P,tr);
  Object.keys(SIDES).forEach(k=>{const here=P.filter(o=>{const t=tr[o.i];if(!sidesOf(o.c.id,t.path).includes(k))return false;
    const at=t.path.findIndex(lv=>Object.keys(flagsOf(o.c.id,[lv])).some(f=>SIDES[k].trig.includes(f)));return at===g});
   if(here.length){fresh.add(k);html+=zoneHTML(k,here,tr)}})});
 seen=fresh;
 const wait=P.filter(o=>!tr[o.i].done),prog=tr.map(t=>t.done?total:t.path.length-1);
 html+=`<div class="cut"></div><div class="row2 kv"><span>다음 구역</span><span>${wait.length?'형광등이 켜지면 출력됩니다':'모든 구역 출력 완료 · 결과를 확인하세요'}</span></div>
 <div class="solid"></div><div class="row2 b"><span>진행</span><span>${Math.min(...prog)} / ${total} 구역</span></div>
 <div class="row2 kv"><span>체크 합계</span><span>${P.map(({c,i})=>esc(nameOf(c,i))+' '+stats(c.id,tr[i].path).n).join(' · ')}</span></div>
 ${fresh.size===1?'<p class="hint">각자 두 개 이상 체크하면 아래로 다음 구역이 이어집니다.</p>':''}`;
 $('body').innerHTML=html;
 document.querySelectorAll('.ck').forEach(b=>b.onclick=()=>toggle(b.dataset.c,b.dataset.lv,+b.dataset.k));
 $('openRes').innerHTML=wait.length?`결과 보기 <small>${wait.length}명 탐사 중</small>`:'결과 보기'}

function toggle(cid,lv,k){const m=st.checks[cid]||(st.checks[cid]={}),a=m[lv]||(m[lv]=[]),j=a.indexOf(k),on=j<0;if(on)a.push(k);else a.splice(j,1);
 save();const y=window.scrollY;renderBody();window.scrollTo(0,y);
 const b=document.querySelector(`.ck[data-c="${cid}"][data-lv="${lv}"][data-k="${k}"]`);if(b)b.focus({preventScroll:true});
 const e=ALL[lv].items[k][1];if(on&&e.fx&&b)fx(e.fx,b,e.w)}
function photo(i,file){if(!file||!/^image\//.test(file.type))return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),S=240,m=Math.min(im.width,im.height);c.width=c.height=S;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);st.chars[i].photo=c.toDataURL('image/jpeg',.85);save();renderAll()};im.src=r.result};r.readAsDataURL(file)}
function renderAll(){renderCrew();renderBody()}

const busy={};
function fx(kind,btn,w){if(reduce()||busy[kind])return;busy[kind]=1;const done=ms=>setTimeout(()=>{busy[kind]=0},ms);
 const sec=btn.closest('section');
 if(kind==='erase'){const el=sec.querySelector('.narr'),orig=el.textContent,ch=[...orig],idx=ch.map((c,i)=>c.trim()?i:-1).filter(i=>i>=0).sort(()=>Math.random()-.5);let n=0;
  const t=setInterval(()=>{for(let r=0;r<4&&n<idx.length;r++,n++)ch[idx[n]]='　';el.textContent=ch.join('');if(n>=idx.length*.85)clearInterval(t)},45);
  setTimeout(()=>{clearInterval(t);let m=0;const back=setInterval(()=>{for(let r=0;r<6&&m<idx.length;r++,m++)ch[idx[m]]=orig[idx[m]];el.textContent=ch.join('');if(m>=idx.length){clearInterval(back);el.textContent=orig}},30)},3200);done(4600)}
 else if(kind==='dup'){const me=btn.closest('.it').querySelector('.tx').textContent,tx=[...sec.querySelectorAll('.it .tx')],orig=tx.map(t=>t.textContent);
  tx.forEach((t,i)=>setTimeout(()=>{t.textContent=me},i*90));tx.forEach((t,i)=>setTimeout(()=>{t.textContent=orig[i]},2800+i*90));done(3800)}
 else if(kind==='whisper'){const p=$('paper'),d=document.createElement('div');d.className='whis';d.setAttribute('aria-hidden','true');d.textContent=((w||'여기야')+'   ').repeat(3).trim();
  d.style.top=(sec.offsetTop+20+Math.random()*Math.max(40,sec.offsetHeight-60))+'px';d.style.left=(8+Math.random()*40)+'%';p.appendChild(d);setTimeout(()=>d.remove(),3700);done(3700)}
 else if(kind==='mirror'||kind==='blur'){sec.classList.add('fx-'+kind);setTimeout(()=>sec.classList.remove('fx-'+kind),2700);done(2800)}
 else if(kind==='flicker'){const v=document.createElement('div');v.className='veil flick';document.body.appendChild(v);setTimeout(()=>v.remove(),2500);done(2500)}
 else if(kind==='dark'){const r=btn.getBoundingClientRect(),v=document.createElement('div');v.className='veil torch';v.style.background=`radial-gradient(circle at ${r.left+r.width/2}px ${r.top+r.height/2}px, transparent 0, transparent 70px, rgba(15,13,8,.94) 150px)`;document.body.appendChild(v);setTimeout(()=>v.remove(),3300);done(3300)}
 else if(kind==='name'){const ins=[...document.querySelectorAll('.nm')];if(ins.some(x=>x===document.activeElement)){busy[kind]=0;return}
  const vals=ins.map(x=>x.value),shown=ins.map((x,i)=>x.value||x.placeholder);ins.forEach((x,i)=>{x.classList.add('haunt');x.value=ins.length>1?shown[(i+1)%ins.length]:'???';x.readOnly=true});
  setTimeout(()=>ins.forEach((x,i)=>{x.value=vals[i];x.classList.remove('haunt');x.readOnly=false}),3000);done(3000)}}

/* 결과 */
const ANIM={stairs:['wave','.7s'],operator:['type','.01s'],exit:['glow','1.2s'],wind:['drift','.6s'],together:['gather','.8s'],front:['rise','.5s'],lucky:['flip','.6s'],
 wall:['wall','2.6s'],hand:['squeeze','1.6s'],swap:['rise','.5s'],stay:['sink','2.2s'],job:['type','.01s'],loop:['type','.01s'],knock:['rise','.5s'],blind:['blind','1.6s'],paint:['smear','.9s'],walk:['walk','2.4s']};
function titleHTML(t,key){const ch=[...t],n=ch.length;return ch.map((c,i)=>`<span class="c" style="--i:${i};--o:${(i-(n-1)/2).toFixed(1)}">${esc(c)}</span>`).join('')}
function outcome(){const tr=st.chars.map(c=>trace(c.id)),n=st.chars.length;
 const rows=st.chars.map((c,i)=>({c,i,t:tr[i],e:tr[i].done?ending(c.id,tr[i].path):null}));
 const fin=rows.filter(r=>r.e),ok=fin.filter(r=>r.e.cls==='ok').length;
 const kind=fin.length<n?'wait':ok===n?'ok':ok===0?'no':'mix';return{tr,n,rows,fin,ok,kind}}
function resultHTML(o){const {tr,n,rows,fin,ok,kind}=o,hm=fin.some(r=>r.e.cls==='hm');
 const H={wait:[`${n}명 중 ${fin.length}명 정산 완료`,'아직 노란 방 어딘가를 헤매는 사람이 있습니다.','정산 중','var(--soft)'],
  ok:['전원 귀환','모두 형광등 없는 밤하늘을 다시 봤다.','전원 귀환','var(--ok)'],
  no:[hm?'아무도 확실히 돌아오지 못했다':'전원 실종','카펫 냄새가 아직도 난다.','전원 미귀환','var(--red)'],
  mix:[`${n}명 중 ${ok}명 탈출`,'돌아온 사람은 떠난 사람의 이름을 자꾸 잊는다.','일부 미귀환','var(--red)']}[kind];
 const s3=new Set(tr.map(t=>t.path[3]).filter(Boolean)),s4=new Set(tr.map(t=>t.path[4]).filter(Boolean)),met=tr.filter(t=>t.path[5]).length;
 const story=(s3.size>1||s4.size>1)?(met>1?'갈림길에서 흩어졌다가 비상계단에서 다시 만났다.':'갈림길에서 흩어진 뒤 다시 만나지 못했다.'):(tr.every(t=>t.path[3])?'처음부터 끝까지 같은 길을 걸었다.':'');
 const h=hash(JSON.stringify(st.checks)+st.chars.map(c=>c.name).join());let d=0;const step=()=>(d+=.35).toFixed(2)+'s';
 return`<div class="tube" aria-hidden="true"></div><div class="paper"><div class="rrow" style="--d:0s"><div class="head"><div class="meta">탐사 정산서 · No. ${h%9000+1000}</div><h2>${H[0]}</h2><div class="meta">${H[1]}</div></div></div>
 ${rows.map(({c,i,t,e})=>{const k=e?e.key:'',a=ANIM[k]||['rise','.5s'],dd=step();return`<div class="rrow e-${k}" style="--d:${dd};--a:${a[0]};--t:${a[1]}"><div class="cut"></div>
  <div class="res-who"><span>${okP(c.photo)?`<img src="${c.photo}" alt="">`:'<i class="noimg"></i>'}<i style="width:12px;height:12px;border-radius:50%;background:${okC(c.color)};flex:none"></i>${esc(nameOf(c,i))}</span>
  <em style="color:${e?(e.cls==='ok'?'var(--ok)':e.cls==='no'?'var(--red)':'var(--amber)'):'var(--soft)'}">${e?e.label:'탐사 중'}</em></div>
  <div class="res-t" data-key="${k}" data-full="${esc(e?e.title:'')}" ${e&&e.cls==='hm'?`data-ghost="${esc(e.title)}"`:''}>${e?titleHTML(e.title,k):esc(LV[t.path[t.path.length-1]].name)+'에서 헤매는 중'}</div>
  <p class="res-p">${e?e.desc:`${t.need}개 더 체크하면 다음 구역으로 갑니다.`}</p>
  <div class="row2" style="margin-top:8px"><span>${t.path.filter(l=>!['WALK','FORK'].includes(l)).map(l=>LV[l].name).join(' → ')}${e?' → '+(e.cls==='no'?'출구 없음':'출구'):''}</span><span class="nw">정신력 ${(e?e.s:stats(c.id,t.path)).san}</span></div></div>`}).join('')}
 <div class="rrow" style="--d:${step()}"><div class="solid"></div><div class="row2 b"><span>귀환 인원</span><span>${ok} / ${n}</span></div>
 ${story?`<div class="row2 kv"><span>동행 기록</span><span>${story}</span></div>`:''}
 <div class="row2 kv"><span>총 체류 시간</span><span>${h%60+12}시간${fin.length&&ok<n?' + ∞':''}</span></div>
 <div class="meta" style="text-align:center;margin-top:16px">이 영수증은 반품되지 않습니다</div></div>
 <div class="stamp" style="color:${H[3]};--d:${(d+.5).toFixed(2)}s">${H[2]}</div></div>`}
function scriptTitles(root){root.querySelectorAll('.res-t[data-key]').forEach(t=>{const k=t.dataset.key,full=t.dataset.full,row=t.closest('.rrow'),d=parseFloat(getComputedStyle(row).getPropertyValue('--d'))*1000+250;if(!full||reduce())return;
 if(k==='swap'){const pool='가나다라마바사아자차카타파하노란벽지문';setTimeout(()=>{let n=0;const it=setInterval(()=>{t.textContent=[...full].map(c=>c===' '?c:pool[Math.floor(Math.random()*pool.length)]).join('');if(++n>14){clearInterval(it);t.textContent=full}},80)},d+600)}
 if(k==='loop'){setTimeout(()=>{let s=full,del=true;const it=setInterval(()=>{if(del){s=s.slice(0,-1);if(s.length<=3)del=false}else{s=full.slice(0,s.length+1);if(s===full)clearInterval(it)}t.textContent=s},90)},d+full.length*50+800)}
 if(k==='knock')setTimeout(()=>{row.classList.add('play-t')},0)})}
function openResult(){const o=outcome(),ov=document.createElement('div');ov.className='ov';ov.setAttribute('role','dialog');ov.setAttribute('aria-label','탐사 결과');
 ov.innerHTML=`<div class="wrap pre" id="resSheet">${resultHTML(o)}</div><div class="ov-bar"><button id="backRes">← 일지로</button><button class="go" id="saveRes">이미지 저장</button></div>`;
 document.body.appendChild(ov);document.body.style.overflow='hidden';
 const sheet=$('resSheet');const play=()=>{sheet.classList.remove('pre');sheet.classList.add('play');scriptTitles(sheet)};
 if(o.kind!=='wait'&&!reduce()){const it=document.createElement('div');it.className='intro s-'+o.kind;it.setAttribute('aria-hidden','true');
  it.innerHTML=o.kind==='ok'?'<div class="lt"></div><p>문이 열렸다.</p>':o.kind==='no'?'<div class="tb"></div><p>불이 꺼졌다.</p>':'<div class="dk"></div><div class="lt" style="left:25%"></div><p>누군가는 문을 지나갔다.</p>';
  ov.appendChild(it);let gone=false;const end=()=>{if(gone)return;gone=true;it.classList.add('out');setTimeout(()=>it.remove(),500);play()};it.onclick=end;setTimeout(end,3100)}
 else play();
 const close=()=>{ov.remove();document.body.style.overflow='';$('openRes').focus()};
 $('backRes').onclick=close;ov.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 $('saveRes').onclick=e=>shoot(sheet,e.currentTarget,'정산서');$('saveRes').focus({preventScroll:true})}

async function shoot(el,btn,label){const old=btn.innerHTML;btn.disabled=true;btn.textContent='인쇄 중…';
 try{await document.fonts.ready;const cv=await html2canvas(el,{scale:2,backgroundColor:'#d6c98c',logging:false,windowWidth:760,
   onclone:d=>{d.documentElement.classList.add('cap');d.querySelectorAll('.fx-mirror,.fx-blur').forEach(s=>s.classList.remove('fx-mirror','fx-blur'));d.querySelectorAll('.new').forEach(s=>s.classList.remove('new'));d.querySelectorAll('.res-t[data-full]').forEach(t=>{if(t.dataset.full)t.textContent=t.dataset.full})}});
  const fname=`백룸_${label}_${st.chars.map((c,i)=>nameOf(c,i)).join('_').replace(/[\\/:*?"<>|\s]/g,'')}.png`;
  if(dl){const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
   try{await dl.save({filename:fname,data:blob});toast('저장했어요')}catch(err){const c=err&&err.code;if(c==='declined')toast('저장을 취소했어요');else if(c==='rate_limited')toast('잠시 후 다시 눌러 주세요');else show(cv)}}
  else show(cv)}catch(err){toast('이미지를 만들지 못했어요')}
 btn.disabled=false;btn.innerHTML=old}
function show(cv){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div><b>이미지를 길게 누르거나 우클릭해서 저장하세요</b><img alt="백룸 탐사 기록" src="${cv.toDataURL('image/png')}"><button>닫기</button></div>`;d.onclick=e=>{if(e.target===d||e.target.tagName==='BUTTON')d.remove()};document.body.appendChild(d)}
function toast(t){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}

$('openRes').onclick=openResult;
$('saveMain').onclick=e=>shoot($('sheet'),e.currentTarget,'일지');
renderAll();
if(window.claude&&claude.use)claude.use('downloads').then(d=>{dl=d}).catch(()=>{});
}
